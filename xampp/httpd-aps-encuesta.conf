# =========================================================================
#  Encuesta_APS — Sitio en Apache (XAMPP)
#  -------------------------------------------------------------------------
#  Apache es la puerta de entrada: sirve los archivos estáticos (HTML, JS,
#  CSS, logos) y reenvía /api/* al servidor Node, que corre en la misma
#  máquina y sólo escucha en 127.0.0.1.
#
#  Por qué Node sigue detrás: el servidor valida cada ficha con el mismo
#  motor de reglas que corre el navegador (reglas.js, catalogos.js, ...).
#  Reescribirlo en PHP dejaría dos motores que se desincronizan.
#
#  Lo instala xampp/instalar.ps1, que sustituye las rutas de abajo y añade
#  "Include conf/extra/httpd-aps-encuesta.conf" al final de httpd.conf.
#  No lo edite en C:\xampp: edite la copia del repositorio y reinstale.
#
#  Requiere: mod_proxy, mod_proxy_http, mod_headers, mod_rewrite, mod_deflate.
# =========================================================================

Define APS_DIR "__APS_DIR__"
Define APS_PUERTO __APS_PUERTO__
Define APS_API __APS_API__

Listen ${APS_PUERTO}

# -------------------------------------------------------------------------
#  1. Fuera del sitio propio, la carpeta no se sirve
# -------------------------------------------------------------------------
#  La carpeta está en htdocs, así que el sitio por defecto de XAMPP (puerto
#  80 y 443) la publicaría tal cual: bd/, .env.local con la clave de la
#  base, node_modules... Se niega aquí y sólo el VirtualHost de abajo la
#  abre. Las secciones dentro de <VirtualHost> se aplican después de las de
#  fuera, por eso el permiso del sitio gana.
<Directory "${APS_DIR}">
    Require all denied
</Directory>

#  Quien entre por http://localhost/aps_encuesta llega al sitio correcto.
RewriteEngine On
RewriteCond %{SERVER_PORT} !=${APS_PUERTO}
RewriteCond %{HTTP_HOST} ^([^:]+)
RewriteRule ^/aps_encuesta(/.*)?$ http://%1:${APS_PUERTO}/ [R=302,L]

# -------------------------------------------------------------------------
#  2. El sitio
# -------------------------------------------------------------------------
<VirtualHost *:${APS_PUERTO}>
    ServerName localhost
    DocumentRoot "${APS_DIR}"
    DirectoryIndex index.html

    ErrorLog "logs/aps-encuesta-error.log"
    CustomLog "logs/aps-encuesta-access.log" common

    <Directory "${APS_DIR}">
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted

        #  Nada de esto es para el navegador: configuración, esquemas,
        #  documentos de trabajo, el código del servidor y sus registros.
        <FilesMatch "(?i)(^\.|\.(md|sql|csv|pdf|docx|xlsx|log|bat|cmd|ps1|conf|lock)$|^(package(-lock)?\.json|servidor\.js|vercel\.json|skills-lock\.json|playwright\..*)$)">
            Require all denied
        </FilesMatch>
    </Directory>

    #  Carpetas completas fuera del alcance HTTP. api/ no se lista: esas
    #  rutas las toma el proxy antes de llegar al disco.
    RedirectMatch 404 "(?i)^/(bd|pruebas|node_modules|xampp|logs|\.[^/]*)(/|$)"

    #  /login es la URL corta de la pantalla de ingreso (igual que vercel.json).
    RewriteEngine On
    RewriteRule ^/login/?$ /login.html [L]

    # ---------------------------------------------------------------------
    #  API → Node
    # ---------------------------------------------------------------------
    ProxyRequests Off
    ProxyPreserveHost On
    #  El reporte SISPRO arma todas las fichas de un periodo: puede tardar.
    ProxyTimeout 300

    #  Node toma la IP del cliente del primer valor de X-Forwarded-For (para
    #  el bloqueo por intentos fallidos). Se borra lo que mande el navegador
    #  y mod_proxy pone la IP real; si no, cualquiera la falsificaría.
    RequestHeader unset X-Forwarded-For early
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        /api/ http://127.0.0.1:${APS_API}/api/
    ProxyPassReverse /api/ http://127.0.0.1:${APS_API}/api/

    # ---------------------------------------------------------------------
    #  Cabeceras de seguridad — las mismas de vercel.json y servidor.js
    # ---------------------------------------------------------------------
    #  "set" sin "always" reemplaza la que ya manda Node en /api en vez de
    #  duplicarla.
    Header set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), payment=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://nominatim.openstreetmap.org https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    #  Compresión, como hace servidor.js: los .js del motor y el CSS suman
    #  ~1,2 MB y bajan a ~300 KB. En un teléfono con datos es lo que más se nota.
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json text/csv image/svg+xml

    #  Los estáticos se revalidan siempre: tras actualizar la aplicación
    #  nadie se queda con un reglas.js viejo en caché. /api ya responde
    #  no-store desde Node.
    <LocationMatch "^/(?!api/)">
        Header set Cache-Control "no-cache"
    </LocationMatch>
</VirtualHost>
